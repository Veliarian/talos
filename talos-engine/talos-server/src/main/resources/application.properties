spring.application.name=talos-server
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/talos_db
spring.datasource.username=talos_admin
spring.datasource.password=talos_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable Open-Session-in-View to prevent connection leaks during long tile streaming
spring.jpa.open-in-view=false

# Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5

# Root runtime data directory relative to repository root
talos.storage.root=talos-data

talos.bbox.minLat=49.95
talos.bbox.maxLat=50.05
talos.bbox.minLon=23.50
talos.bbox.maxLon=23.70